---
- name: Require Debian-family system
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'

- name: Install Longhorn dependencies
  ansible.builtin.apt:
    name: [open-iscsi, nfs-common]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure registry credentials before K3s starts
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0600"
  no_log: true
  notify: Restart existing K3s

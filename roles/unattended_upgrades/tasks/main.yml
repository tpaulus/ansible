---
- name: Require Debian-family system
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'

- name: Install unattended upgrade packages
  ansible.builtin.apt:
    name: [unattended-upgrades, apt-config-auto-update, apt-listchanges]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure unattended upgrades
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    mode: "0644"
  loop: [20auto-upgrades, 50unattended-upgrades]
  notify: Restart unattended upgrades

- name: Enable automatic APT update timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [apt-daily.timer, apt-daily-upgrade.timer]

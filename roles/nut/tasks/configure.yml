---
- name: Install NUT on Debian without starting unconfigured services
  ansible.builtin.apt:
    name: [nut, sudo]
    state: present
    policy_rc_d: 101
    lock_timeout: 120
  when: ansible_facts['os_family'] == 'Debian'

- name: Install NUT on FreeBSD
  ansible.builtin.package:
    name: [nut, sudo]
    state: present
  when: ansible_facts['os_family'] == 'FreeBSD'

- name: Create NUT configuration directory
  ansible.builtin.file:
    path: "{{ nut_config_dir }}"
    state: directory
    owner: root
    group: "{{ nut_group }}"
    mode: "0750"

- name: Create NUT runtime directory
  ansible.builtin.file:
    path: /var/run/nut
    state: directory
    owner: "{{ nut_user }}"
    group: "{{ nut_group }}"
    mode: "0755"

- name: Configure NUT mode
  ansible.builtin.template:
    src: nut.conf.j2
    dest: "{{ nut_config_dir }}/nut.conf"
    mode: "0644"
  notify: Restart NUT

- name: Configure UPS server
  when: nut_mode == 'primary'
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ nut_config_dir }}/{{ item }}"
    owner: "{{ nut_user }}"
    group: "{{ nut_group }}"
    mode: "0640"
  loop: [ups.conf, upsd.conf, upsd.users]
  no_log: true
  notify:
    - Refresh NUT driver enumeration
    - Restart NUT

- name: Configure UPS monitor
  ansible.builtin.template:
    src: "upsmon-{{ nut_mode }}.conf.j2"
    dest: "{{ nut_config_dir }}/upsmon.conf"
    owner: root
    group: "{{ nut_group }}"
    mode: "0640"
  no_log: true
  notify: Restart NUT

- name: Install UPS scheduler
  ansible.builtin.template:
    src: upssched-cmd.j2
    dest: /usr/local/bin/upssched-cmd
    mode: "0755"
  notify: Restart NUT

- name: Permit only the UPS emergency shutdown command
  ansible.builtin.copy:
    dest: /usr/local/etc/sudoers.d/ansible-nut-shutdown
    content: "{{ nut_user }} ALL=(root) NOPASSWD: /sbin/ups-shutdown\n"
    mode: "0440"
    validate: /usr/local/sbin/visudo -cf %s
  when: ansible_facts['os_family'] == 'FreeBSD'

- name: Permit Linux UPS emergency shutdown
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ansible-nut-shutdown
    content: "{{ nut_user }} ALL=(root) NOPASSWD: /sbin/ups-shutdown\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: ansible_facts['os_family'] == 'Debian'

- name: Configure UPS scheduler
  ansible.builtin.template:
    src: upssched.conf.j2
    dest: "{{ nut_config_dir }}/upssched.conf"
    mode: "0644"
  notify: Restart NUT

- name: Enable FreeBSD NUT services
  when: ansible_facts['os_family'] == 'FreeBSD'
  community.general.sysrc:
    name: "{{ item }}_enable"
    value: "YES"
  loop: "{{ nut_services }}"

- name: Read Linux services
  when: ansible_facts['system'] == 'Linux'
  ansible.builtin.service_facts:

- name: Disable unused Linux NUT driver on secondary hosts
  when:
    - ansible_facts['system'] == 'Linux'
    - nut_mode == 'secondary'
    - "'nut-driver.service' in ansible_facts['services']"
  ansible.builtin.systemd_service:
    name: nut-driver.service
    enabled: false
    state: stopped
    masked: true

- name: Unmask Linux NUT driver on primary hosts
  when:
    - ansible_facts['system'] == 'Linux'
    - nut_mode == 'primary'
    - "'nut-driver.service' in ansible_facts['services']"
  ansible.builtin.systemd_service:
    name: nut-driver.service
    masked: false

- name: Reload packaged USB access rules for the primary UPS
  ansible.builtin.command:
    argv: [udevadm, control, --reload-rules]
  changed_when: false
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nut_mode == 'primary'
    - nut_usb_devices | length > 0

- name: Apply packaged USB permissions only to the selected UPS devices
  ansible.builtin.command:
    argv:
      - udevadm
      - trigger
      - --subsystem-match=usb
      - "--attr-match=idVendor={{ item.vendor }}"
      - "--attr-match=idProduct={{ item.product }}"
      - --action=change
  loop: "{{ nut_usb_devices }}"
  changed_when: false
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nut_mode == 'primary'

- name: Wait for selected UPS device access rules
  ansible.builtin.command:
    argv: [udevadm, settle, --timeout=30]
  changed_when: false
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nut_mode == 'primary'
    - nut_usb_devices | length > 0

- name: Enable packaged driver enumeration at primary UPS boot
  ansible.builtin.systemd_service:
    name: nut-driver-enumerator.service
    enabled: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nut_mode == 'primary'
    - "'nut-driver-enumerator.service' in ansible_facts['services']"

- name: Enumerate configured UPS drivers before starting the server
  ansible.builtin.systemd_service:
    name: nut-driver-enumerator.service
    state: started
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nut_mode == 'primary'
    - "'nut-driver-enumerator.service' in ansible_facts['services']"
    - ansible_facts['services'].keys() | select('match', '^nut-driver@.+[.]service$') | list | length == 0

- name: Enable packaged UPS configuration change detection
  ansible.builtin.systemd_service:
    name: nut-driver-enumerator.path
    enabled: true
    state: started
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nut_mode == 'primary'
    - "'nut-driver-enumerator.service' in ansible_facts['services']"

- name: Enable the packaged primary UPS boot target
  ansible.builtin.systemd_service:
    name: nut.target
    enabled: true
    state: started
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nut_mode == 'primary'
    - "'nut-driver-enumerator.service' in ansible_facts['services']"

- name: Enable NUT services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ nut_services }}"

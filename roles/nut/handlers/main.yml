---
- name: Refresh NUT driver enumeration
  ansible.builtin.systemd_service:
    name: nut-driver-enumerator.service
    state: restarted
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nut_mode == 'primary'
    - "'nut-driver-enumerator.service' in ansible_facts['services']"

- name: Restart NUT
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: restarted
  loop: "{{ nut_services }}"

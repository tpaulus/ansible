---
- name: Minimize host swapping
  ansible.builtin.import_tasks: swap.yml

- name: Set system timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  notify: Restart cron

- name: Configure Debian compute and storage tools
  when: "'device_roles_compute' in group_names or 'device_roles_storage' in group_names"
  block:
    - name: Require supported compute or storage OS
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: Compute and storage provisioning supports Debian-family systems only.
    - name: Enable Debian non-free-firmware component for CPU microcode
      ansible.builtin.deb822_repository:
        name: debian-non-free-firmware
        types: deb
        uris: "{{ base_debian_mirror }}"
        suites: "{{ [ansible_facts['distribution_release'], ansible_facts['distribution_release'] ~ '-updates'] }}"
        components: [non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present
      when: ansible_facts['distribution'] == 'Debian' and base_microcode_packages | length > 0
      notify: Update apt cache
    - name: Refresh apt cache before installing packages
      ansible.builtin.meta: flush_handlers
    - name: Install common tools
      ansible.builtin.apt:
        name: "{{ base_packages
          + (['zsh'] if 'device_roles_storage' in group_names else [])
          + base_microcode_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Read service facts
      ansible.builtin.service_facts:
    - name: Configure active time synchronization backend
      ansible.builtin.include_tasks: ntp.yml

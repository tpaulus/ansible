---
- name: Minimize host swapping
  ansible.builtin.import_tasks: swap.yml

- name: Set system timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  notify: Restart cron

- name: Configure Debian compute and storage tools
  when: "'device_roles_compute' in group_names or 'device_roles_storage' in group_names"
  block:
    - name: Require supported compute or storage OS
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: Compute and storage provisioning supports Debian-family systems only.
    - name: Install common tools
      ansible.builtin.apt:
        name: "{{ base_packages + (['zsh'] if 'device_roles_storage' in group_names else []) }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Read service facts
      ansible.builtin.service_facts:
    - name: Configure active time synchronization backend
      ansible.builtin.include_tasks: ntp.yml

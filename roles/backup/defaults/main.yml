---
backup_restic_version: "0.18.1"
backup_restic_bin: /usr/bin/restic
backup_metrics_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter') }}"
backup_sources: []
backup_required_apps: >-
  {{ apps_definitions | default({}) | dict2items
     | selectattr('value.backup_required', 'defined')
     | selectattr('value.backup_required')
     | map(attribute='key') | list }}
backup_max_concurrent: 2
backup_snapshot_result_bin: /usr/local/libexec/app-snapshot-result.py
backup_app_snapshots_bin: /usr/local/sbin/app-snapshots
backup_lock: /run/lock/restic.lock
backup_calendar: "*-*-* 00/3:00:00"
backup_timer_enabled: true
backup_pruning_approved: false
backup_check_calendar: "Sun *-*-* 02:00:00"
backup_cloud_sync_source_keys: []
backup_cloud_sync_max_delete: 100
backup_architectures:
  x86_64: amd64
  aarch64: arm64
backup_cloud_sync_enabled: false
backup_cloud_sync_deletion_approved: false
backup_cloud_sync_calendar: hourly

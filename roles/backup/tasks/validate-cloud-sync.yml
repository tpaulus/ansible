---
- name: Require explicit cloud mirror source and filters
  ansible.builtin.assert:
    that:
      - backup_cloud_sync_dataset_key in config_resolved.datasets
      - backup_cloud_sync_filters | length > 0
    fail_msg: Configure the source dataset and rclone filters before enabling cloud sync.

- name: Verify cloud sync backing storage
  ansible.builtin.command:
    argv:
      - "{{ backup_mount_guard }}"
      - "{{ config_resolved.datasets[backup_cloud_sync_dataset_key].path }}"
      - "{{ config_resolved.datasets[backup_cloud_sync_dataset_key].dataset }}"
  changed_when: false
  when: not ansible_check_mode

---
- name: Ensure mount guard directory
  ansible.builtin.file:
    path: "{{ mount_guard_path | dirname }}"
    state: directory
    mode: "0755"

- name: Install runtime ZFS mount guard
  ansible.builtin.copy:
    src: mount-guard
    dest: "{{ mount_guard_path }}"
    owner: root
    group: root
    mode: "0755"

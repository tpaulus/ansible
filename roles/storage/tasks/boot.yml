---
- name: Read imported pools before configuring boot adoption
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, name]
  register: storage_imported_pools
  changed_when: false
  check_mode: false

- name: Require only the approved pools and one consistent alternate root
  ansible.builtin.assert:
    that:
      - storage_imported_pools.stdout_lines | sort == storage_pools.keys() | list | sort
      - storage_altroots | length == 1
    fail_msg: Cache-only boot imports require exactly the approved active pools and a consistent alternate root.
  vars:
    storage_altroots: "{{ storage_pools | dict2items | map(attribute='value.altroot', default='') | unique | list }}"

- name: Read the current approved pool cache locations
  ansible.builtin.command:
    argv: [zpool, get, -H, -o, value, cachefile, "{{ item }}"]
  loop: "{{ storage_pools.keys() | list }}"
  register: storage_cache_locations
  changed_when: false
  check_mode: false

- name: Inspect the host-only approved pool cache
  ansible.builtin.stat:
    path: /etc/zfs/zpool.cache
  register: storage_cache

- name: Persist only the approved active pools in the boot cache
  ansible.builtin.command:
    argv: [zpool, set, cachefile=/etc/zfs/zpool.cache, "{{ item.item }}"]
  loop: "{{ storage_cache_locations.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | trim != '/etc/zfs/zpool.cache' or not storage_cache.stat.exists
  changed_when: true

- name: Preserve the original alternate root for packaged boot imports
  ansible.builtin.lineinfile:
    path: /etc/default/zfs
    regexp: "^ZPOOL_IMPORT_OPTS="
    line: "ZPOOL_IMPORT_OPTS={{ ('-R ' ~ storage_altroot if storage_altroot else '') | quote }}"
    validate: /bin/sh -n %s
  vars:
    storage_altroot: "{{ (storage_pools | dict2items | first).value.altroot | default('') }}"

- name: Disable discovery-based imports and the competing native share owner
  ansible.builtin.command:
    argv: [systemctl, mask, zfs-import-scan.service, "zfs-import@.service", zfs-share.service]
  register: storage_boot_masks
  changed_when: "'Created symlink' in storage_boot_masks.stderr"

- name: Enable only the packaged cache import and mount lifecycle
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: false
    enabled: true
  loop: [zfs-import-cache.service, zfs-import.target, zfs-mount.service, zfs.target]

- name: Activate the packaged ZFS lifecycle after explicit pool adoption
  ansible.builtin.systemd_service:
    name: zfs.target
    state: started
    daemon_reload: true

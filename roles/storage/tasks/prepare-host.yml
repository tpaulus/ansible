---
- name: Detect the protected source appliance
  ansible.builtin.stat:
    path: /usr/bin/midclt
  register: storage_prepare_appliance

- name: Require one confirmed Debian preparation target
  ansible.builtin.assert:
    that:
      - ansible_limit | default('') | length > 0
      - ansible_limit != 'all'
      - ansible_play_hosts_all | length == 1
      - storage_prepare_confirm | default('') == inventory_hostname
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
      - not storage_prepare_appliance.stat.exists
      - not ansible_check_mode

- name: Read kernel pool inventory before changing import services
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --types, zfs]
  register: storage_prepare_mounts
  changed_when: false
  failed_when: storage_prepare_mounts.rc not in [0, 1]

- name: Inspect whether OpenZFS kernel accounting exists
  ansible.builtin.stat:
    path: /proc/spl/kstat/zfs
  register: storage_prepare_kstat

- name: Inspect the kernel's imported pool directory
  ansible.builtin.find:
    paths: /proc/spl/kstat/zfs
    file_type: directory
    recurse: false
  register: storage_prepare_pools
  when: storage_prepare_kstat.stat.isdir | default(false)

- name: Refuse preparation against already adopted storage
  ansible.builtin.assert:
    that:
      - storage_prepare_mounts.stdout | trim | length == 0
      - storage_prepare_pools.matched | default(0) == 0
    fail_msg: Storage is already adopted; use normal reconciliation, not initial host preparation.

- name: Persist local logs independently of Loki availability
  ansible.builtin.include_role:
    name: alloy
    tasks_from: journal

- name: Apply persistent journal configuration
  ansible.builtin.meta: flush_handlers

- name: Prevent package and boot import before explicit adoption
  ansible.builtin.command:
    argv:
      - systemctl
      - mask
      - zfs-import-cache.service
      - zfs-import-scan.service
      - "zfs-import@.service"
      - zfs-import.target
      - zfs-mount.service
      - zfs-share.service
      - zfs.target
      - zfs-zed.service
      - smartmontools.service
      - smartd.service
  register: storage_prepare_masks
  changed_when: "'Created symlink' in storage_prepare_masks.stderr"

- name: Install signed Debian contrib sources and matching OpenZFS tooling
  ansible.builtin.include_role:
    name: storage
    tasks_from: packages

- name: Load OpenZFS without importing any pool
  ansible.builtin.command:
    argv: [modprobe, zfs]
  changed_when: false

- name: Verify that no pool was automatically imported
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, name]
  register: storage_prepare_imported
  changed_when: false
  failed_when: >-
    storage_prepare_imported.rc not in [0, 1]
    or storage_prepare_imported.stdout | trim | length > 0

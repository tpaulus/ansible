---
storage_pools: {}
storage_extra_datasets: {}
storage_mount_guard: /usr/local/libexec/mount-guard
storage_packages:
  - zfsutils-linux
  - zfs-dkms
  - python3
  - util-linux
  - "linux-headers-{{ ansible_facts['kernel'] }}"
  - "linux-headers-{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"

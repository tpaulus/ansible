---
- name: Restart persistent NAS journal
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

- name: Flush early boot logs into the persistent NAS journal
  ansible.builtin.command:
    argv: [journalctl, --flush]
  changed_when: false
  listen: Restart persistent NAS journal

- name: Restart NAS Alloy firewall
  ansible.builtin.systemd_service:
    name: alloy-metrics-firewall.service
    daemon_reload: true
    state: restarted

- name: Restart NAS Alloy
  ansible.builtin.systemd_service:
    name: alloy.service
    daemon_reload: true
    state: restarted

- name: Restart NAS Alloy heartbeat
  ansible.builtin.systemd_service:
    name: alloy-heartbeat.timer
    daemon_reload: true
    state: restarted

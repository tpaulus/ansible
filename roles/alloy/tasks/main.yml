---
- name: Require collector endpoint and monitoring sources
  ansible.builtin.assert:
    that:
      - alloy_loki_url is match('^https://[A-Za-z0-9.-]+(?::[0-9]+)?/otlp/v1/logs$')
      - alloy_metrics_sources | length > 0
    fail_msg: Configure the HTTPS Loki OTLP endpoint and allowed monitoring networks.

- name: Install collector firewall and journal prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - nftables
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create collector configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/alloy
    - /etc/systemd/journald.conf.d

- name: Configure bounded persistent system and user journals
  ansible.builtin.include_tasks: journal.yml

- name: Configure restricted native collector management access
  ansible.builtin.template:
    src: metrics.nft.j2
    dest: /etc/alloy/metrics.nft
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft --check --file %s
  notify: Restart NAS Alloy firewall

- name: Install and start collector management firewall service
  ansible.builtin.template:
    src: alloy-metrics-firewall.service.j2
    dest: /etc/systemd/system/alloy-metrics-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart NAS Alloy firewall

- name: Start collector management firewall before Alloy
  ansible.builtin.systemd_service:
    name: alloy-metrics-firewall.service
    daemon_reload: true
    enabled: true
    state: started

- name: Install a journal heartbeat independent of NAS applications
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - alloy-heartbeat.service
    - alloy-heartbeat.timer
  notify: Restart NAS Alloy heartbeat

- name: Render NAS Alloy configuration for Grafana's role
  ansible.builtin.set_fact:
    alloy_nas_config: "{{ lookup('ansible.builtin.template', 'config.alloy.j2') }}"

- name: Install and configure Grafana Alloy
  ansible.builtin.include_role:
    name: grafana.grafana.alloy
  vars:
    alloy_config: "{{ alloy_nas_config }}"
    alloy_env_file_vars:
      CUSTOM_ARGS: >-
        --storage.path=/var/lib/alloy
        --stability.level=public-preview
        --server.http.listen-addr 0.0.0.0:{{ alloy_listen_port }}
        --server.http.enable-pprof=false
        --disable-reporting
      RESTART_ON_UPGRADE: "false"
    __alloy_server_http_listen_address: 127.0.0.1
    __alloy_server_http_listen_port: "{{ alloy_listen_port }}"
    alloy_systemd_override: |
      [Unit]
      Requires=alloy-metrics-firewall.service
      After=alloy-metrics-firewall.service systemd-journald.service
    alloy_readiness_check_use_proxy: false
    alloy_user_groups:
      - adm
      - systemd-journal

- name: Apply journal and collector changes
  ansible.builtin.meta: flush_handlers

- name: Flush early-boot runtime journal entries into persistent storage
  ansible.builtin.command: journalctl --flush
  changed_when: false

- name: Verify collector can read persistent system and per-user journals
  become: true
  become_user: alloy
  ansible.builtin.command: journalctl --directory=/var/log/journal --no-pager --quiet --lines=1 --output=json
  register: alloy_journal_access
  changed_when: false
  failed_when: alloy_journal_access.rc != 0 or alloy_journal_access.stdout | trim | length == 0
  no_log: true

- name: Enable native journal heartbeat independently of data pools
  ansible.builtin.systemd_service:
    name: alloy-heartbeat.timer
    enabled: true
    state: started

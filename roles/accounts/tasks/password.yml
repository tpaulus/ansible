---
- name: Check the applied secret revision without exposing it
  ansible.builtin.stat:
    path: "/var/lib/nas/smb-passwords/{{ password_account.key }}"
    checksum_algorithm: sha256
  register: accounts_password_revision
  no_log: true

- name: Apply a new or changed SMB password
  ansible.builtin.command:
    argv: [smbpasswd, -a, -s, "{{ password_account.key }}"]
    stdin: "{{ accounts_smb_passwords[password_account.key] }}\n{{ accounts_smb_passwords[password_account.key] }}\n"
  changed_when: true
  when: >-
    password_account.key not in
    (accounts_password_db.stdout_lines | default([]) | map('split', ':') | map('first') | list)
    or accounts_password_revision.stat.checksum | default('') !=
    (accounts_smb_passwords[password_account.key] | hash('sha256') | hash('sha256'))
  no_log: true

- name: Save the applied revision only after successful password update
  ansible.builtin.copy:
    content: "{{ accounts_smb_passwords[password_account.key] | hash('sha256') }}"
    dest: "/var/lib/nas/smb-passwords/{{ password_account.key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

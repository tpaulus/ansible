---
- name: Detect appliance middleware before applying credentials
  ansible.builtin.stat:
    path: /usr/bin/midclt
  register: accounts_appliance

- name: Require explicit SMB credential application
  ansible.builtin.assert:
    that:
      - ansible_limit | default('') | length > 0
      - ansible_limit != 'all'
      - ansible_play_hosts_all | length == 1
      - password_confirm | default('') == inventory_hostname
      - accounts_smb_passwords is mapping
      - ansible_facts['distribution'] == 'Debian'
      - not accounts_appliance.stat.exists
    fail_msg: Specify a single NAS --limit and password_confirm=HOST.

- name: Read existing SMB account identities without changing them
  ansible.builtin.command:
    argv: [id, -u, "{{ item.key }}"]
  loop: "{{ accounts_users | dict2items | selectattr('value.smb', 'defined') | selectattr('value.smb') }}"
  register: accounts_smb_ids
  changed_when: false
  check_mode: false

- name: Require provisioned account IDs before resetting passwords
  ansible.builtin.assert:
    that: item.stdout | int == item.item.value.uid | int
    fail_msg: Provision the reviewed NAS account identities before applying SMB credentials.
  loop: "{{ accounts_smb_ids.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Require every SMB account secret before applying any changes
  ansible.builtin.assert:
    that:
      - item.key in accounts_smb_passwords
      - accounts_smb_passwords[item.key] is string
      - accounts_smb_passwords[item.key] | length > 0
      - "'\n' not in accounts_smb_passwords[item.key]"
  loop: "{{ accounts_users | dict2items | selectattr('value.smb', 'defined') | selectattr('value.smb') }}"
  no_log: true

- name: Install password database tooling without starting file services
  ansible.builtin.apt:
    name: [samba, samba-common-bin]
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Read existing Samba accounts before applying secret revisions
  ansible.builtin.command:
    argv: [pdbedit, -L]
  register: accounts_password_db
  changed_when: false
  when: not ansible_check_mode

- name: Create private credential revision directory
  ansible.builtin.file:
    path: /var/lib/nas/smb-passwords
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Apply Vault-managed SMB credentials
  ansible.builtin.include_tasks: password.yml
  loop: "{{ accounts_users | dict2items | selectattr('value.smb', 'defined') | selectattr('value.smb') }}"
  loop_control:
    loop_var: password_account
    label: "{{ password_account.key }}"

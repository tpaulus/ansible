---
- name: Install the app-state copy dependency
  ansible.builtin.apt:
    name: rsync
    state: present

- name: Create the restricted repository-owned capture configuration directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "{{ '0755' if item == '/etc/apps' else '0700' }}"
  loop: [/etc/apps, /etc/apps/capture.d]

- name: Install the guarded app-consistent capture operation
  ansible.builtin.copy:
    src: capture-app.py
    dest: /usr/local/sbin/capture-app
    owner: root
    group: root
    mode: "0700"

- name: Prepare declared private capture parent datasets
  ansible.builtin.include_tasks: dataset.yml
  vars:
    apps_app: {identity: {name: root}}
    apps_mount: "{{ apps_capture_parent }}"
  loop: "{{ apps_capture_parents }}"
  loop_control:
    loop_var: apps_capture_parent
    label: "{{ apps_capture_parent.dataset }}"

- name: Prepare selected approved app capture datasets
  ansible.builtin.include_tasks: dataset.yml
  vars:
    apps_app: {identity: {name: root}}
    apps_mount: "{{ apps_captures[apps_capture_app.name] }}"
  loop: "{{ apps_resolved }}"
  loop_control:
    loop_var: apps_capture_app
    label: "{{ apps_capture_app.name }}"
  when: apps_capture_app.name in apps_captures

- name: Publish only selected app capture policies
  ansible.builtin.copy:
    content: "{{ item | capture_config(apps_captures, apps_mount_guard) | to_nice_json }}\n"
    dest: "/etc/apps/capture.d/{{ item.name }}.json"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ apps_resolved }}"
  loop_control:
    label: "{{ item.name }}"

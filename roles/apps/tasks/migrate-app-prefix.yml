---
- name: Check for the legacy application Quadlet
  ansible.builtin.stat:
    path: "{{ apps_legacy_identity.home }}/.config/containers/systemd/nas-{{ apps_legacy_app.key }}.container"
  vars:
    apps_legacy_identity: "{{ apps_accounts | selectattr('name', 'equalto', apps_legacy_app.value.account) | first }}"
  register: apps_legacy_quadlet

- name: Retire the legacy user service
  become: true
  become_user: "{{ apps_legacy_app.value.account }}"
  vars:
    apps_legacy_identity: "{{ apps_accounts | selectattr('name', 'equalto', apps_legacy_app.value.account) | first }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ apps_legacy_identity.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ apps_legacy_identity.uid }}/bus"
  block:
    - name: Stop the legacy generated application service
      ansible.builtin.systemd_service:
        name: "nas-{{ apps_legacy_app.key }}.service"
        scope: user
        state: stopped
      when: apps_legacy_quadlet.stat.exists

    - name: Remove legacy Quadlets and generated configuration only
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ apps_legacy_identity.home }}/{{ item }}"
        state: absent
      loop:
        - ".config/containers/systemd/nas-{{ apps_legacy_app.key }}.container"
        - ".config/containers/candidate/nas-{{ apps_legacy_app.key }}.container"
        - .config/nas-apps

    - name: Reload the user manager after retiring the old Quadlet
      ansible.builtin.systemd_service:
        scope: user
        daemon_reload: true
      when: apps_legacy_quadlet.stat.exists

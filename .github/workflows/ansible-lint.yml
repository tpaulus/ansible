name: Ansible validation
on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install Galaxy dependencies
        run: |
          ansible-galaxy role install -r requirements.yml --roles-path .ansible/roles --force
          ansible-galaxy collection install -r requirements.yml --collections-path .ansible/collections
      - name: Lint Ansible content
        env:
          ANSIBLE_INVENTORY: inventories/ci/hosts.yml
        run: ansible-lint --offline
      - name: Check every playbook
        run: bash scripts/check-syntax.sh

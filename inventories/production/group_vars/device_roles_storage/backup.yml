---
# Reapply the packaged USB permissions without unplugging the primary UPS.
nut_usb_devices:
  - {vendor: "051d", product: "0003"}
# Enable scheduled backups; retention/pruning remains separately gated.
backup_timer_enabled: true
backup_pruning_approved: true
backup_sources:
  - {key: photos, dataset_key: photos, repository_prefix: Photos, kind: files}
  - {key: docs, dataset_key: docs, repository_prefix: Docs, kind: files}
  - {key: mel, dataset_key: mel, repository_prefix: Mel, kind: files}
  - {key: tom, dataset_key: tom, repository_prefix: Tom, kind: files}
  - {key: archive, dataset_key: archive, repository_prefix: Archive, kind: files}
  - key: jellyfin
    app: jellyfin
    kind: app_snapshot
    repository_prefix: Jellyfin
    snapshot: "{{ apps_snapshots.jellyfin }}"
  - key: prometheus
    app: prometheus
    kind: app_snapshot
    repository_prefix: Prometheus
    snapshot: "{{ apps_snapshots.prometheus }}"
  - key: webdav
    app: webdav
    kind: app_snapshot
    repository_prefix: WebDAV
    snapshot: "{{ apps_snapshots.webdav }}"
# Original post-hook only published this role's managed completion metric.
backup_cloud_sync_enabled: true
backup_cloud_sync_deletion_approved: true
backup_cloud_sync_dataset_key: server_backups
backup_cloud_sync_source_keys: [homeassistant, db_dumps, k3s_etcd]
backup_cloud_sync_bucket: woodland-park-hosted-server-backups
backup_cloud_sync_remote_path: ""
backup_cloud_sync_b2_account_id: "{{ vault_nas_backup_cloud_sync_b2_account_id }}"
backup_cloud_sync_b2_account_key: "{{ vault_nas_backup_cloud_sync_b2_account_key }}"
backup_cloud_sync_crypt_password: "{{ vault_nas_backup_cloud_sync_crypt_password }}"
backup_cloud_sync_crypt_salt: "{{ vault_nas_backup_cloud_sync_crypt_salt }}"
maintenance_snapshots:
  - dataset_key: server_backups
    hourly: 168
    daily: 14
    recursive: true
    exclude_children: [Svalbard]
  - dataset_key: longhorn
    hourly: 0
    daily: 14
    recursive: false

---
all:
  vars:
    node_exporter_version: "1.10.2"
    ups_name: ups
    ups_host: 192.0.2.1
    upsmon_ups_name: ups@192.0.2.1
    ups_monuser: test
    ups_monuser_password: fixture-only
    ups_ctlusr: test
    ups_ctlusr_password: fixture-only
    docker_user: fixture
    docker_token: fixture-only
  children:
    device_roles_compute:
      hosts:
        ci_compute:
          ansible_host: 192.0.2.10
    device_roles_storage:
      hosts:
        WoodlandPark:
          ansible_host: 192.0.2.20
          storage_pools:
            fixture:
              guid: "1234"
              mountpoint: /mnt/fixture
          accounts_groups:
            alice: 4000
            backups: 4001
          accounts_users:
            alice:
              uid: 4000
              group: alice
              smb: true
          nas:
            schema_version: 2
            datasets:
              backups:
                dataset: fixture/Client Backups
                owner: alice
                group: backups
                smb:
                  name: Fixture backups
                  valid_users: [alice]
                nfs:
                  purpose: k3s-etcd
                  clients:
                    - inventory_group: tags_k3s
                  squash: none
    device_roles_firewall:
      hosts:
        ci_firewall:
          ansible_host: 192.0.2.1
    racks_Compute:
      hosts:
        ci_compute:
        ci_firewall:
    tags_nut_primary:
      hosts:
        ci_firewall:
    tags_k3s:
      vars:
        k3s_control_node: true
      hosts:
        ci_compute:

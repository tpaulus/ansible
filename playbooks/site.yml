---
- name: Apply common configuration
  ansible.builtin.import_playbook: provision/common.yml
- name: Configure storage
  ansible.builtin.import_playbook: provision/storage.yml
- name: Configure K3s
  ansible.builtin.import_playbook: provision/k3s.yml
- name: Record the successful Ansible run
  hosts: all
  become: true
  gather_facts: false
  tags: [always]
  roles:
    - role: last_run_metrics

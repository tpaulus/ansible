---
- name: Update and reboot compute systems
  hosts: device_roles_compute
  become: true
  serial: 1
  any_errors_fatal: true
  tags: [maintenance, updates]
  tasks:
    - name: Validate update targets
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
          - ansible_limit | default('') | length > 0
          - ansible_limit != 'all'
          - k3s_update_control_host is defined
          - k3s_update_control_host in groups['tags_k3s']
          - hostvars[k3s_update_control_host]['k3s_control_node'] | default(false) | bool
          - k3s_update_control_host not in ansible_play_hosts_all
        fail_msg: Updates require Debian-family compute hosts, an explicit --limit, and a surviving K3s control host set with k3s_update_control_host.

    - name: Read Kubernetes node name
      ansible.builtin.set_fact:
        update_k3s_node: "{{ ansible_facts['hostname'] | lower }}"

    - name: Verify surviving control-plane health
      delegate_to: "{{ k3s_update_control_host }}"
      ansible.builtin.command:
        argv: [kubectl, get, --raw=/readyz]
      changed_when: false

    - name: Cordon target node
      delegate_to: "{{ k3s_update_control_host }}"
      ansible.builtin.command:
        argv: [kubectl, cordon, "{{ update_k3s_node }}"]
      register: update_k3s_cordon
      changed_when: "'already cordoned' not in update_k3s_cordon.stdout"

    - name: Drain target node
      delegate_to: "{{ k3s_update_control_host }}"
      ansible.builtin.command:
        argv:
          - kubectl
          - drain
          - "{{ update_k3s_node }}"
          - --ignore-daemonsets
          - --delete-emptydir-data
          - --timeout=300s
      register: update_k3s_drain
      changed_when: "'evicting pod' in update_k3s_drain.stdout"

    - name: Mark drained node for automatic uncordon after reboot
      ansible.builtin.file:
        path: /etc/k3s-drained
        state: touch
        mode: "0644"

    - name: Refresh APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade packages
      ansible.builtin.apt:
        upgrade: full
        autoremove: true
        autoclean: true

    - name: Inspect reboot requirement
      ansible.builtin.stat:
        path: /run/reboot-required
      register: update_reboot

    - name: Reboot when required
      when: update_reboot.stat.exists
      ansible.builtin.reboot:
        reboot_timeout: 300
        msg: Reboot initiated by Ansible for package updates

    - name: Uncordon target when no reboot is required
      when: not update_reboot.stat.exists
      delegate_to: "{{ k3s_update_control_host }}"
      ansible.builtin.command:
        argv: [kubectl, uncordon, "{{ update_k3s_node }}"]
      register: update_k3s_uncordon
      changed_when: "'already uncordoned' not in update_k3s_uncordon.stdout"

    - name: Remove drained marker when no reboot is required
      when: not update_reboot.stat.exists
      ansible.builtin.file:
        path: /etc/k3s-drained
        state: absent

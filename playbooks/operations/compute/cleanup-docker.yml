---
- name: Remove stopped Docker containers and unused images
  hosts: device_roles_compute
  become: true
  serial: 1
  tags: [maintenance, docker]
  tasks:
    - name: Require explicit targets
      ansible.builtin.assert:
        that:
          - ansible_limit | default('') | length > 0
          - ansible_limit != 'all'
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: Run maintenance with --limit selecting the intended hosts.

    - name: Read service facts
      ansible.builtin.service_facts:

    - name: Install Docker API dependency
      when: "'docker.service' in ansible_facts['services']"
      ansible.builtin.apt:
        name: python3-requests
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Prune Docker resources
      when: "'docker.service' in ansible_facts['services']"
      community.docker.docker_prune:
        containers: true
        images: true
        images_filters:
          dangling: false

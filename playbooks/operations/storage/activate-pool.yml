---
- name: Explicitly activate one inspected pool without upgrading features
  hosts: device_roles_storage
  become: true
  gather_facts: true
  tasks:
    - name: Enable writes only for the explicitly approved inspected pool
      ansible.builtin.include_role:
        name: storage
        tasks_from: activate-pool
      vars:
        storage_activate_confirm: "{{ activate_confirm | default('') }}"
        storage_activate_pool: "{{ activate_pool | default('') }}"
        storage_activate_guid: "{{ activate_guid | default('') }}"
        storage_activate_backups_verified: "{{ activate_backups_verified | default(false) }}"
        storage_activate_previous_host_offline: "{{ activate_previous_host_offline | default(false) }}"

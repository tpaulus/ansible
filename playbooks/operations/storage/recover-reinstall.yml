---
- name: Bootstrap applier access for the installer administrator migration
  hosts: device_roles_storage
  become: true
  gather_facts: true
  serial: 1
  vars:
    installer_admin_group: "{{ accounts_users[installer_admin_user].group }}"
  pre_tasks:
    - name: Resolve the inventory administrator account
      ansible.builtin.set_fact:
        installer_admin_user: >-
          {{ accounts_users | dict2items
             | selectattr('value.ssh_access', 'defined')
             | selectattr('value.ssh_access')
             | map(attribute='key') | first }}

    - name: Require one explicitly limited Debian target
      ansible.builtin.assert:
        that:
          - ansible_limit | default('') | length > 0
          - ansible_limit != 'all'
          - ansible_play_hosts_all | length == 1
          - ansible_facts['distribution'] == 'Debian'
          - not ansible_check_mode
        fail_msg: "Limit this operation to one freshly installed Debian NAS."

    - name: Read the installed administrator user and group
      ansible.builtin.getent:
        database: "{{ item }}"
      loop: [passwd, group]

    - name: Require the installed administrator account and group
      ansible.builtin.assert:
        that:
          - installer_admin_user in ansible_facts.getent_passwd
          - installer_admin_group in ansible_facts.getent_group
        fail_msg: "The installed administrator account or group is missing; resolve it before recovery."

    - name: Determine whether the administrator IDs need migration
      ansible.builtin.set_fact:
        installer_admin_migration_required: >-
          {{ ansible_facts.getent_passwd[installer_admin_user][1] | int != accounts_users[installer_admin_user].uid | int
             or ansible_facts.getent_passwd[installer_admin_user][2] | int != accounts_groups[installer_admin_group] | int
             or ansible_facts.getent_group[installer_admin_group][1] | int != accounts_groups[installer_admin_group] | int }}

    - name: Report that the administrator already has the inventory IDs
      ansible.builtin.debug:
        msg: "The administrator already has the inventory UID/GID; skipping the applier bootstrap and ID migration."
      when: not (installer_admin_migration_required | bool)

    - name: Read the effective SSH configuration for the NAS
      ansible.builtin.command:
        argv: [ssh, -G, "{{ ansible_host | default(inventory_hostname) }}"]
      delegate_to: localhost
      become: false
      register: installer_admin_ssh_config
      changed_when: false
      when: installer_admin_migration_required | bool

    - name: Require an SSH agent socket in the effective configuration
      ansible.builtin.assert:
        that:
          - installer_admin_ssh_config.stdout_lines | select('match', '^identityagent ') | list | length == 1
          - >-
            (installer_admin_ssh_config.stdout_lines | select('match', '^identityagent ') | first)
            | regex_replace('^identityagent ', '') != 'none'
        fail_msg: "No SSH agent is configured for the NAS connection."
      when: installer_admin_migration_required | bool

    - name: Resolve the SSH agent socket used for the NAS connection
      ansible.builtin.set_fact:
        installer_admin_ssh_agent_socket: >-
          {{ (installer_admin_ssh_config.stdout_lines | select('match', '^identityagent ') | first)
             | regex_replace('^identityagent ', '') }}
      when: installer_admin_migration_required | bool

    - name: Read public keys offered by that SSH agent
      ansible.builtin.command:
        argv: [ssh-add, -L]
      delegate_to: localhost
      become: false
      environment:
        SSH_AUTH_SOCK: "{{ installer_admin_ssh_agent_socket }}"
      register: installer_admin_ssh_agent
      changed_when: false
      failed_when: installer_admin_ssh_agent.rc != 0
      when: installer_admin_migration_required | bool

    - name: Require exactly one SSH agent identity for applier bootstrap
      ansible.builtin.assert:
        that:
          - installer_admin_ssh_agent.stdout_lines | length == 1
          - installer_admin_ssh_agent.stdout is match('^(ssh-|ecdsa-|sk-)')
        fail_msg: >-
          The SSH agent configured for this NAS must offer exactly one public key.
          Unlock the intended 1Password SSH identity and retry.
      when: installer_admin_migration_required | bool

  tasks:
    - name: Create the applier account and SSH access
      ansible.builtin.import_role:
        name: applier
      vars:
        applier_ssh_authorized_key: "{{ installer_admin_ssh_agent.stdout }}"
      when: installer_admin_migration_required | bool

    - name: Close the installer-account SSH connection
      ansible.builtin.meta: reset_connection
      when: installer_admin_migration_required | bool

- name: Change the administrator from installer IDs to inventory IDs through applier
  hosts: device_roles_storage
  remote_user: applier
  vars:
    ansible_user: applier
    installer_admin_user: "{{ hostvars[inventory_hostname].installer_admin_user }}"
    installer_admin_group: "{{ accounts_users[installer_admin_user].group }}"
  become: true
  gather_facts: false
  serial: 1
  pre_tasks:
    - name: Skip the ID migration when the administrator already has the inventory IDs
      ansible.builtin.meta: end_play
      when: not (hostvars[inventory_hostname].installer_admin_migration_required | default(false) | bool)

    - name: Read the installed administrator user and group
      ansible.builtin.getent:
        database: "{{ item }}"
      loop: [passwd, group]

    - name: Require the administrator to have the installer or inventory identity
      ansible.builtin.assert:
        that:
          - installer_admin_user in ansible_facts.getent_passwd
          - installer_admin_group in ansible_facts.getent_group
          - ansible_facts.getent_passwd[installer_admin_user][1] | int in [1000, accounts_users[installer_admin_user].uid | int]
          - ansible_facts.getent_passwd[installer_admin_user][2] | int in [1000, accounts_groups[installer_admin_group] | int]
          - ansible_facts.getent_group[installer_admin_group][1] | int in [1000, accounts_groups[installer_admin_group] | int]
          - >-
            ansible_facts.getent_passwd | dict2items | rejectattr('key', 'equalto', installer_admin_user)
            | selectattr('value.1', 'equalto', accounts_users[installer_admin_user].uid | string)
            | list | length == 0
          - >-
            ansible_facts.getent_group | dict2items | rejectattr('key', 'equalto', installer_admin_group)
            | selectattr('value.1', 'equalto', accounts_groups[installer_admin_group] | string)
            | list | length == 0
        fail_msg: >-
          The administrator does not have the expected installer/inventory IDs, or the inventory UID/GID
          is already assigned to another account. Resolve the conflict manually.

    - name: List remaining administrator processes
      ansible.builtin.command:
        argv: [ps, -U, "{{ installer_admin_user }}", -u, "{{ installer_admin_user }}", -o, "pid=,comm="]
      register: installer_admin_processes
      changed_when: false

    - name: Resolve administrator process names
      ansible.builtin.set_fact:
        installer_admin_process_names: >-
          {{ installer_admin_processes.stdout_lines
             | map('trim')
             | reject('equalto', '')
             | map('split')
             | map('last')
             | list }}

    - name: Refuse to stop administrator shells or other running processes
      ansible.builtin.assert:
        that:
          - installer_admin_process_names | difference(['systemd', '(sd-pam)']) | length == 0
        fail_msg: >-
          The administrator still has processes beyond the systemd user session:
          {{ installer_admin_processes.stdout_lines | join(', ') }}.
          Log out of the administrator shell and stop these processes, then rerun.

    - name: Terminate the administrator's remaining systemd user session
      ansible.builtin.command:
        argv: [loginctl, terminate-user, "{{ installer_admin_user }}"]
      changed_when: true
      when: installer_admin_process_names | length > 0

    - name: Wait for administrator processes to stop
      ansible.builtin.command:
        argv: [ps, -U, "{{ installer_admin_user }}", -u, "{{ installer_admin_user }}", -o, "pid=,comm="]
      register: installer_admin_processes_after
      changed_when: false
      failed_when: installer_admin_processes_after.rc not in [0, 1]
      until: installer_admin_processes_after.stdout | trim | length == 0
      retries: 10
      delay: 1

  tasks:
    - name: Set the administrator group to its inventory GID
      ansible.builtin.group:
        name: "{{ installer_admin_group }}"
        gid: "{{ accounts_groups[installer_admin_group] }}"
        state: present

    - name: Set the administrator to its inventory UID
      ansible.builtin.user:
        name: "{{ installer_admin_user }}"
        uid: "{{ accounts_users[installer_admin_user].uid }}"
        group: "{{ installer_admin_group }}"
        create_home: false
        state: present

    - name: Update ownership of the administrator home after the ID change
      ansible.builtin.file:
        path: "{{ accounts_users[installer_admin_user].home }}"
        state: directory
        owner: "{{ installer_admin_user }}"
        group: "{{ installer_admin_group }}"
        recurse: true

- name: Restore the default applier SSH key after the administrator migration
  hosts: device_roles_storage
  remote_user: applier
  vars:
    ansible_user: applier
    installer_admin_user: "{{ hostvars[inventory_hostname].installer_admin_user }}"
  become: true
  gather_facts: false
  serial: 1
  pre_tasks:
    - name: Skip applier setup when the administrator IDs already match inventory
      ansible.builtin.meta: end_play
      when: not (hostvars[inventory_hostname].installer_admin_migration_required | default(false) | bool)
  tasks:
    - name: Reapply the standard applier configuration and key
      ansible.builtin.import_role:
        name: applier

- name: Import approved storage, then run normal site provisioning
  hosts: device_roles_storage
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Select the pool configured for this host
      ansible.builtin.set_fact:
        recover_pool_name: "{{ recover_pool | default(storage_pools.keys() | first) }}"

    - name: Require one explicitly limited Debian target and an inventory-approved pool
      ansible.builtin.assert:
        that:
          - ansible_limit | default('') | length > 0
          - ansible_limit != 'all'
          - ansible_play_hosts_all | length == 1
          - ansible_facts['distribution'] == 'Debian'
          - recover_pool_name in storage_pools
          - not ansible_check_mode
        fail_msg: >-
          Limit recovery to one Debian target.
          Run only after the previous host is offline; backups are assumed.

    - name: Resolve the approved pool GUID from inventory
      ansible.builtin.set_fact:
        recover_pool_guid: "{{ storage_pools[recover_pool_name].guid | string }}"

    - name: Check whether OpenZFS is installed
      ansible.builtin.stat:
        path: /usr/sbin/zpool
      register: recover_zpool_binary

    - name: Read imported pools without importing any storage
      ansible.builtin.command:
        argv: [zpool, list, -H, -o, name]
      register: recover_imported
      changed_when: false
      failed_when: recover_imported.rc not in [0, 1]
      when: recover_zpool_binary.stat.exists

    - name: Record the current import set
      ansible.builtin.set_fact:
        recover_imported_names: "{{ recover_imported.stdout_lines | default([]) }}"

    - name: Refuse any imported pool other than the approved one
      ansible.builtin.assert:
        that:
          - recover_imported_names | sort in [[], [recover_pool_name]]
        fail_msg: "Unexpected storage is already imported; stop and inspect it before recovery."

    - name: Read the approved imported pool state
      ansible.builtin.command:
        argv: [zpool, get, -H, -o, "property,value", "guid,readonly,cachefile,altroot", "{{ recover_pool_name }}"]
      register: recover_pool_properties_raw
      changed_when: false
      when: recover_imported_names == [recover_pool_name]

    - name: Read imported dataset mount state
      ansible.builtin.command:
        argv: [zfs, get, -Hr, -o, value, mounted, "{{ recover_pool_name }}"]
      register: recover_mount_states
      changed_when: false
      when: recover_imported_names == [recover_pool_name]

    - name: Resolve imported pool properties
      ansible.builtin.set_fact:
        recover_pool_properties: "{{ dict(recover_pool_properties_raw.stdout_lines | map('split')) }}"
      when: recover_imported_names == [recover_pool_name]

    - name: Classify the imported pool phase
      ansible.builtin.set_fact:
        recover_pool_state: "{{ 'inspection' if recover_pool_properties.readonly == 'on' else 'active' }}"
      when: recover_imported_names == [recover_pool_name]

    - name: Require the approved read-only inspection or writable pool state
      ansible.builtin.assert:
        that:
          - recover_pool_properties.guid == recover_pool_guid
          - recover_pool_properties.cachefile == 'none'
          - recover_pool_properties.altroot == storage_pools[recover_pool_name].altroot | default('-')
          - recover_pool_properties.readonly in ['on', 'off']
          - recover_pool_properties.readonly != 'on' or 'yes' not in recover_mount_states.stdout_lines
        fail_msg: >-
          Imported storage is not the approved read-only/unmounted inspection state or
          writable pool state. Do not export or reimport it to recover from later failures.
      when: recover_imported_names == [recover_pool_name]

    - name: Mark an absent pool for the initial preparation phase
      ansible.builtin.set_fact:
        recover_pool_state: absent
      when: recover_imported_names | length == 0

  tasks:
    - name: Resolve NetBox share context for storage preflight
      ansible.builtin.import_role:
        name: config

    - name: Prepare Debian without allowing automatic pool import
      ansible.builtin.include_role:
        name: storage
        tasks_from: prepare-host
      vars:
        storage_prepare_confirm: "{{ inventory_hostname }}"
      when: recover_pool_state == 'absent'

    - name: Adopt the approved pool read-only before activating it
      ansible.builtin.include_role:
        name: storage
        tasks_from: adopt-pool
      vars:
        storage_adopt_confirm: "{{ inventory_hostname }}"
        storage_adopt_pool: "{{ recover_pool_name }}"
        storage_adopt_guid: "{{ recover_pool_guid }}"
        storage_adopt_backups_verified: true
        storage_adopt_inspection_only: false
        storage_adopt_allow_stale_hostid: false
      when: recover_pool_state == 'absent'

    - name: Activate the approved pool from its unmounted read-only state
      ansible.builtin.include_role:
        name: storage
        tasks_from: activate-pool
      vars:
        storage_activate_confirm: "ACTIVATE {{ inventory_hostname }}"
        storage_activate_pool: "{{ recover_pool_name }}"
        storage_activate_guid: "{{ recover_pool_guid }}"
        storage_activate_backups_verified: true
        storage_activate_previous_host_offline: true
      when: recover_pool_state in ['absent', 'inspection']

    - name: Install the storage path guard
      ansible.builtin.include_role:
        name: storage
        tasks_from: mount-guard.yml

    - name: Finish mounting an already writable pool after an interrupted recovery
      ansible.builtin.command:
        argv: [zfs, mount, -a]
      changed_when: true
      when: recover_pool_state == 'active'

    - name: Resolve configured application state paths
      ansible.builtin.set_fact:
        apps_resolved: "{{ apps_definitions | resolve_apps(config_resolved, apps_accounts, apps_definitions.keys() | list) }}"

    - name: Verify expected share, app and recovery dataset mounts before provisioning
      ansible.builtin.command:
        argv: ["/usr/local/libexec/mount-guard", "{{ item.path }}", "{{ item.dataset }}"]
      loop: >-
        {{ (config_resolved.mounts | list)
           + (apps_resolved | map(attribute='mounts') | flatten
              | selectattr('create', 'defined') | selectattr('create') | list)
           + (apps_resolved | map(attribute='retained_datasets', default=[]) | flatten | list)
           + apps_snapshot_parents
           + (apps_snapshots | dict2items | map(attribute='value') | list)
           + [storage_pools[recover_pool_name] | combine({'dataset': recover_pool_name,
               'path': storage_pools[recover_pool_name].mountpoint})] }}
      loop_control:
        label: "{{ item.dataset }} at {{ item.path }}"
      changed_when: false

    - name: Verify required app import markers before provisioning
      ansible.builtin.command:
        argv: [cat, "{{ item.path }}/.nas-app-imported"]
      loop: "{{ apps_resolved | map(attribute='mounts') | flatten | selectattr('require_import', 'defined') | selectattr('require_import') | list }}"
      loop_control:
        label: "{{ item.import_name }}"
      register: recover_import_markers
      changed_when: false
      failed_when: recover_import_markers.stdout | trim != item.import_name

    - name: Verify required imported application files
      ansible.builtin.stat:
        path: "{{ item.0.path }}/{{ item.1 }}"
        follow: false
      loop: >-
        {{ apps_resolved | map(attribute='mounts') | flatten
           | selectattr('require_import', 'defined') | selectattr('require_import')
           | subelements('required_files', skip_missing=true) }}
      loop_control:
        label: "{{ item.0.path }}/{{ item.1 }}"
      register: recover_required_app_state

    - name: Refuse missing or symlinked application data
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - not (item.stat.islnk | default(false))
        fail_msg: "Required application state is missing or unsafe: {{ item.item.0.path }}/{{ item.item.1 }}"
      loop: "{{ recover_required_app_state.results }}"
      loop_control:
        label: "{{ item.item.0.path }}/{{ item.item.1 }}"

    - name: Apply Vault-backed SMB passwords during normal site provisioning
      ansible.builtin.set_fact:
        accounts_apply_recovery_smb_passwords: true

- name: Apply the canonical site configuration
  ansible.builtin.import_playbook: ../../site.yml

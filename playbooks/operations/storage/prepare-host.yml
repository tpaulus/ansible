---
- name: Prepare Debian NAS tooling before importing storage
  hosts: device_roles_storage
  become: true
  gather_facts: true
  tasks:
    - name: Prepare the host without importing a pool
      ansible.builtin.include_role:
        name: storage
        tasks_from: prepare-host
      vars:
        storage_prepare_confirm: "{{ prepare_confirm | default('') }}"

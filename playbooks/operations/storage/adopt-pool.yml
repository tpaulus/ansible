---
- name: Inspect one verified existing pool read-only
  hosts: device_roles_storage
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Import only the explicitly approved pool read-only and unmounted
      ansible.builtin.include_role:
        name: storage
        tasks_from: adopt-pool
      vars:
        storage_adopt_confirm: "{{ adopt_confirm | default('') }}"
        storage_adopt_pool: "{{ adopt_pool | default('') }}"
        storage_adopt_guid: "{{ adopt_guid | default('') }}"
        storage_adopt_backups_verified: "{{ adopt_backups_verified | default(false) }}"
        storage_adopt_inspection_only: "{{ adopt_inspection_only | default(false) }}"
        storage_adopt_allow_stale_hostid: "{{ adopt_allow_stale_hostid | default(false) }}"
        storage_adopt_previous_host_offline: "{{ adopt_previous_host_offline | default(false) }}"

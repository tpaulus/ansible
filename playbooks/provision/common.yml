---
- name: Protect existing storage appliances from Debian provisioning
  hosts: device_roles_storage
  become: true
  gather_facts: false
  tags: [base, monitoring, nut, unattended_upgrades]
  tasks:
    - name: Detect the TrueNAS middleware
      ansible.builtin.stat:
        path: /usr/bin/midclt
      register: common_appliance
    - name: Require the separately authorized Debian installation first
      ansible.builtin.assert:
        that: not common_appliance.stat.exists
        fail_msg: TrueNAS is still installed; do not run Debian provisioning against the appliance.

- name: Configure base system
  hosts: all
  become: true
  tags: [base]
  roles:
    - role: base

- name: Configure node exporter
  hosts: device_roles_compute:device_roles_storage
  become: true
  tags: [monitoring]
  vars:
    node_exporter_system_user: node-exp
    node_exporter_system_group: node-exp
  tasks:
    - name: Configure node exporter with upstream role
      ansible.builtin.include_role:
        name: prometheus.prometheus.node_exporter
        apply:
          tags: [monitoring]

- name: Configure primary UPS monitoring
  hosts: racks_Compute:&tags_nut_primary
  become: true
  tags: [nut]
  vars:
    nut_mode: primary
  roles:
    - role: nut

- name: Configure secondary UPS monitoring
  hosts: racks_Compute:!tags_nut_primary:!device_roles_storage
  become: true
  tags: [nut]
  vars:
    nut_mode: secondary
  roles:
    - role: nut

- name: Configure unattended upgrades
  hosts: device_roles_compute:device_roles_storage
  become: true
  tags: [unattended_upgrades]
  roles:
    - role: unattended_upgrades

- name: Configure message of the day
  hosts: all
  become: true
  tags: [motd]
  roles:
    - role: motd

---
- name: Configure K3s prerequisites
  hosts: tags_k3s
  become: true
  serial: 1
  tags: [k3s]
  roles:
    - role: k3s_config

- name: Build a cluster with HA control plane
  hosts: tags_k3s
  become: true
  tags: [k3s]
  vars:
    k3s_become: true
    k3s_etcd_datastore: true
  roles:
    - role: xanmanning.k3s
    - role: k3s_backup
      tags: [backups]
    - role: k3s_uncordon

- name: Allow K3s backup share access
  hosts: device_roles_storage
  become: true
  tags: [k3s, backups]
  tasks:
    - name: Configure K3s snapshot backup share
      arensb.truenas.sharing_nfs:
        name: "{{ k3s_backup_share_name }}"
        path: "{{ k3s_backup_share }}"
        hosts: "{{ groups['tags_k3s'] | map('extract', hostvars, 'ansible_host') | list | sort }}"

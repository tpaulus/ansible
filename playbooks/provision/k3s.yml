---
- name: Configure K3s prerequisites
  hosts: tags_k3s
  become: true
  serial: 1
  tags: [k3s]
  roles:
    - role: k3s_config

- name: Build a cluster with HA control plane
  hosts: tags_k3s
  become: true
  tags: [k3s]
  vars:
    k3s_become: true
    k3s_etcd_datastore: true
  roles:
    - role: xanmanning.k3s
    - role: k3s_backup
      tags: [backups]
    - role: k3s_uncordon

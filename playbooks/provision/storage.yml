---
- name: Configure Debian storage
  hosts: device_roles_storage
  become: true
  gather_facts: false
  tags: [storage]
  vars:
    storage_role_tags: &storage_role_tags
      - shares
      - accounts
      - backups
      - maintenance
      - apps
      - jellyfin
      - prometheus
      - webdav
  pre_tasks:
    - name: Gather host facts for all storage task selections
      ansible.builtin.setup:
      tags: [always]

    - name: Require Debian 13 or newer
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] | int >= 13
      tags: [always]

  roles:
    - role: config
      tags: *storage_role_tags
    - role: alloy
      tags: [logging]
    - role: storage
      tags: *storage_role_tags
    - role: accounts
      tags: [accounts]
    - role: shares
      tags: [shares]
    - role: maintenance
      tags: [maintenance]
    - role: podman
      tags: [apps, jellyfin, prometheus, webdav]
    - role: apps
      tags: [apps, jellyfin, prometheus, webdav]
    - role: backup
      tags: [backups]
